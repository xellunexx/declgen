<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>declgen — вход</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e1118; color: #e8eaf2; font: 14px system-ui, sans-serif; }
  .card { width: 340px; background: #161a23; border: 1px solid #2a3142; border-radius: 14px; padding: 22px; box-shadow: 0 16px 50px rgba(0,0,0,.5); }
  h1 { margin: 0 0 2px; font-size: 20px; }
  .sub { color: #8a91a3; font-size: 12px; margin-bottom: 18px; }
  label { display: block; font-size: 12px; color: #9aa3b5; margin: 12px 0 4px; }
  input { width: 100%; box-sizing: border-box; background: #0e1118; color: #e8eaf2; border: 1px solid #3a4152; border-radius: 8px; padding: 9px 10px; font: inherit; }
  button { margin-top: 16px; width: 100%; background: #4f7cff; border: 0; color: #fff; padding: 10px; border-radius: 8px; font: inherit; font-weight: 600; cursor: pointer; }
  button.ghost { background: none; border: 1px solid #3a4152; color: #9aa3b5; font-weight: 400; margin-top: 8px; }
  .err { color: #ff9d9d; font-size: 12px; min-height: 16px; margin-top: 10px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tabs button { flex: 1; margin: 0; padding: 7px; border-radius: 7px; background: none; border: 1px solid #3a4152; color: #9aa3b5; font-weight: 400; }
  .tabs button.on { background: #26314a; color: #fff; border-color: #4f7cff; }
</style>
</head>
<body>
<div class="card">
  <h1>declgen</h1>
  <div class="sub">митническа декларация · human gate</div>
  <div class="tabs">
    <button id="t-login" class="on" type="button">Вход</button>
    <button id="t-register" type="button">Регистрация</button>
  </div>
  <form id="f">
    <label>Име</label>
    <input id="name" autocomplete="username" required minlength="2" />
    <label>Парола</label>
    <input id="pass" type="password" autocomplete="current-password" required minlength="6" />
    <button id="go" type="submit">Вход</button>
  </form>
  <div class="err" id="err" role="alert"></div>
</div>
<script>
let mode = 'login';
const tL = document.getElementById('t-login'), tR = document.getElementById('t-register'),
  go = document.getElementById('go'), err = document.getElementById('err'),
  pass = document.getElementById('pass'), f = document.getElementById('f');
function setMode(m) {
  mode = m;
  tL.classList.toggle('on', m === 'login'); tR.classList.toggle('on', m === 'register');
  go.textContent = m === 'login' ? 'Вход' : 'Създай акаунт';
  pass.autocomplete = m === 'login' ? 'current-password' : 'new-password';
  err.textContent = '';
}
tL.onclick = () => setMode('login'); tR.onclick = () => setMode('register');
f.onsubmit = async (e) => {
  e.preventDefault();
  err.textContent = '';
  const name = document.getElementById('name').value.trim();
  const r = await fetch('/__auth/' + mode, {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ name, password: pass.value }),
  });
  const j = await r.json().catch(() => ({ ok: false, error: 'сървърна грешка' }));
  if (j.ok) location.href = '/';
  else err.textContent = j.error || 'грешка';
};
</script>
</body>
</html>
